name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Vet
        run: go vet ./...

      - name: Unit Tests
        run: go test ./... -count=1 -cover

      - name: Integration Tests
        run: go test ./tests/integration/... -tags integration -count=1 -v

      - name: E2E Tests
        run: go test ./tests/e2e/... -tags e2e -count=1 -v

      - name: Build
        run: go build -o raise ./cmd/raise

      - name: Verify binary
        run: ./raise version
